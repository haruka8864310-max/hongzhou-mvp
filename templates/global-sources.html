<div class="panel"><h2>全球來源與行情錄入</h2><p id="globalSourceNote" class="notice">未確認授權的市場不自動抓取。只有調價消息時價格留白、調價填0；不把指數當成交價。</p><details><summary>各市場來源、頻率、授權與取得結果</summary><div id="globalSources"></div></details><details><summary>新增行情／修訂（保留舊版本）</summary><form id="globalQuoteForm"><div class="formgrid"><label>市場<select id="globalInputMarket" required></select></label><label>實際品級／尺寸／工廠<input name="grade" required maxlength="250"></label><label>交貨條件／港口／稅別<input name="delivery_term" required maxlength="250"></label><label>幣別<select name="currency"><option>TWD</option><option>USD</option><option>JPY</option><option>CNY</option><option>KRW</option><option>INR</option><option>VND</option><option>INDEX</option><option>NA</option></select></label><label>單位<select name="unit"><option value="t">公噸</option><option value="kg">公斤</option><option value="short_ton">美制短噸</option><option value="dry_t">乾公噸</option><option value="index">指數</option><option value="million_t">百萬公噸（產量）</option><option>TWD per USD</option><option>TWD per JPY</option><option>TWD per CNY</option><option>JPY per USD</option><option>USD per t</option></select></label><label>頻率<select name="frequency"><option value="weekly">週／調價公告</option><option value="daily">每日觀察</option><option value="monthly">每月</option><option value="annual">每年</option><option value="observed">不定期</option></select></label><label>報價日期／月份<input name="quote_date" required placeholder="日YYYY-MM-DD；月YYYY-MM"></label><label>原幣價格（可留白）<input name="price" type="number" min="0.000001" step="any"></label><label>調價金額（可留白，平盤填0）<input name="adjustment" type="number" step="any"></label><label>發布時間（未知留白）<input name="published_at" type="datetime-local"></label><label>來源名稱<input name="source" required maxlength="150"></label><label>實際來源網址<input name="source_url" type="url" required maxlength="1000"></label><label>有權使用的依據<input name="license_note" required maxlength="500"></label></div><button>驗證並追加版本</button><p id="globalQuoteStatus" role="status"></p></form></deta
