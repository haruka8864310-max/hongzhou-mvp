<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弘洲｜預測實驗室</title><link rel="stylesheet" href="/assets/market.css"><link rel="stylesheet" href="/assets/prediction-lab.css"><script src="/assets/prediction-lab.js" defer></script></head><body><header><div><span class="eyebrow">HONGZHOU · MODEL LAB</span><h1>預測實驗室</h1><p>實際執行LightGBM訓練、時間順序回測與方向推論。</p></div><a href="/">返回市場決策中心</a></header><main>
