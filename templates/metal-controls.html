<div class="panel"><h3>快速找指標</h3><div class="formgrid"><label>搜尋名稱／規格<input id="metalSearch" type="search" placeholder="例如：銅、鋼筋、SD280"></label><label>分類<select id="metalCategory"><option value="all">全部重要指標</option><option value="steel">鋼材與廢鋼</option><option value="metals">國際金屬</option></select></label><label class="checkbox"><input id="metalAdvanced" type="checkbox">進階：顯示其他規格與廢銅指數</label></div></div>
<details class="panel"><summary>更換台灣代表規格（保存後重啟仍保留）</summary><form id="representativeForm"><div class="formgrid"><label>台灣鋼筋<select id="repRebar"></select></label><label>台灣H型鋼<select id="repHbeam"></select></label><label>台灣鋼板<select id="repPlate"></select></label></div><button>保存代表規格</button><p id="repStatus" role="status"></p></form><p class="muted">各規格／地區獨立，不混合平均。優先鋼筋SD280 D16mm北區；H型鋼與鋼板採固定規格，實際歷史筆數列於選項。</p></details>
<details class="panel"><summary>匯入官方檔案或自己的歷史檔案</summary><form id="metalFileForm"><label>資料來源<select id="metalFileProvider"><option value="worldbank">World Bank 官方月度Excel</option><option value="bls">BLS 廢鋼／廢銅</option><option value="tw_rebar">工程會鋼筋</option><option value="tw_hbeam">工程會H型鋼</option><option value="tw_plate">工程會鋼板</option></select></label><label>CSV／Excel／JSON檔<input id="metalFile" type="file" accept=".csv,.xlsx,.json" required></label><button>驗證並匯入</button><p id="metalFileStatus" role="status"></p></form><p class="muted">支援原版World Bank月度XLSX、工程會CSV、BLS JSON。自訂CSV／XLSX欄位為 series_id,period,value,source_url；月份格式YYYY-MM。自訂檔需先更新來源建立規格，來源網址須完全相同；最多5000筆。僅匯入有權使用的資料，保留舊版本。</p></details>
