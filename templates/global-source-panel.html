<div class="panel"><h2>資料來源與更新狀態</h2><p id="globalSourceNote" class="notice">主畫面的行情自動讀取已下載資料。只有平盤資訊時會標示缺少基準價，不還原絕對價格。</p><button type="button" id="globalManualOpen">補記一筆價格</button><details><summary>來源詳細狀態、口徑與使用條件</summary><div id="globalSources"></div></details><details id="globalAdvancedData"><summary>進階資料管理：CSV匯入</summary><a class="button subtle" href="/api/global/template">下載空白CSV範本</a><p class="muted">UTF-8、2MB／5000筆；使用市場代碼與完整原始規格。發布未知留白，已知須含時區。取得時間由系統記錄，任一錯誤整批取消。</p><form id="globalCSVForm"><input id="globalCSV" type="file" accept=".csv" required><button>驗證並匯入</button><p id="globalCSVStatus" role="status"></p></form></details></div>
<dialog id="globalPriceDialog"><div class="toolbar"><h2>補記價格</h2><button id="globalManualClose" type="button" class="subtle">關閉</button></div><p class="muted">已有固定規格時，來源與單位會自動帶入。只有調價消息請展開進階欄位，價格留白。</p><form id="globalQuoteForm"><div class="formgrid"><label>商品<select id="globalInputMarket" required></select></label><label>報價日期／月份<input name="quote_date" required placeholder="YYYY-MM-DD；月資料YYYY-MM"></label><label>原幣價格<input name="price" type="number" min="0.000001" step="any"></label></div><details id="globalPriceAdvanced"><summary>進階：規格、單位、調價與來源</summary><div class="formgrid"><label>固定品級／工廠<input name="grade" required maxlength="250"></label><label>原報價方式<input name="delivery_term" required maxlength="250"></label><label>幣別<select name="currency"><option>TWD</option><option>USD</option><option>JPY</option><option>CNY</option><option>KRW</option><option>INR</option><option>VND</option><option>INDEX</option><option>NA</option></select></label><label>單位<select name="unit"><option value="t">公噸</option><option value="kg">公斤</option><option value="short_ton">美制短噸</option><option value="dry_t">乾公噸</option><option value="index">指數</option><option value="million_t">百萬公噸（產量）</option><option>TWD per USD</option><option>TWD per JPY</option><option>TWD per CNY</option><option>JPY per USD</option><option>USD per t</option></select></label><label>資料頻率<select name="frequency"><option value="weekly">週公告</option><option value="daily">每日觀察</option><option value="monthly">每月</option><option value="annual">每年</option><option value="observed">調價日／不定期</option></select></label><label>調價金額（平盤填0）<input name="adjustment" type="number" step="any"></label><label>已知發布時間<input name="published_at" type="datetime-local"></label><label>來源名稱<input name="source" required maxlength="150"></label><label>原始來源網址<input name="source_url" type="url" required maxlength="1000"></label><label>使用依據<input name="license_note" required maxlength="500"></label></div></details><button>保存並保留舊版本</button><p id="globalQuoteStatus" role="status"></p></form></dialog>
