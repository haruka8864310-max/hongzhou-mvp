<div class="panel settings-panel"><div class="toolbar"><div><h2>追蹤與分析設定</h2><p class="muted">設定保存在這台電腦，重新啟動仍會保留。取消追蹤只隱藏與停止更新，不刪除歷史。</p></div><button type="button" data-sync>立即更新真實匯率</button></div>
<form id="settingsform"><fieldset><legend>追蹤的市場</legend><div id="trackedMarkets" class="checkgrid"></div></fieldset><div class="formgrid"><label class="checkbox"><input id="autoUpdate" type="checkbox"> APP 執行時背景更新</label><label>自動來源<select id="sourceProvider"><option value="cbc">中央銀行（日參考；僅研究）</option><option value="frankfurter">Frankfurter 混合參考（備選）</option></select></label><label>檢查來源頻率<select id="updateMinutes"><option value="60">每 1 小時</option><option value="360">每 6 小時</option><option value="1440">每天</option></select></label><label>分析與首次匯入期間（天）<input id="analysisDays" type="number" min="30" max="1825" value="365" required></label><label>異常波動門檻（%）<input id="anomalyPercent" type="number" min="0.1" max="100" step="0.1" value="5" required></label><label>預設比較市場 A<select id="defaultCompareA" required></select></label><label>預設比較市場 B<select id="defaultCompareB" required></select></label></div><button>儲存並套用設定</button><p id="settingsStatus" class="status" role="status"></p></form><p class="muted">只有匯率目前有自動連接器。增加檢查頻率不會讓來源日參考變成即時報價；APP 關閉時不更新，下次啟動依保存時間接續。手動更新至少間隔一分鐘。</p></div>
<div class="panel"><h3>資料來源狀態與使用條件</h3><p id="syncStatus" class="status" role="status"></p><div class="scroll"><table><thead><tr><th>市場／來源</th><th>更新狀態</th><th>報價日／成功取得／最後檢查</th><th>頻率、歷史與授權</th></tr></thead><tbody id="sourceRows"></tbody></table></div></div>
